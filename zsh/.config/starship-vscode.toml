"$schema" = "https://starship.rs/config-schema.json"

format = """
[](mauve)\
$username\
[](fg:mauve bg:peach)\
$directory\
[](peach) \
$git_branch\
${custom.git_dirty}\
$conda\
$time\
$line_break\
$character"""

palette = "catppuccin_mocha"
add_newline = false

[username]
show_always = true
style_user = "fg:crust bg:mauve"
style_root = "fg:crust bg:red"
format = "[ $user ]($style)"

[directory]
style = "fg:crust bg:peach"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:crust bg:yellow"
format = "[](yellow)[ $symbol $branch ]($style)[](yellow) "
truncation_length = 18
truncation_symbol = "…"

[custom.git_dirty]
command = "printf '●'"
when = "test -n \"$(git status --porcelain --ignore-submodules=dirty 2>/dev/null)\""
require_repo = true
shell = ["/bin/sh"]
format = "[](red)[ $output ](fg:crust bg:red)[](red) "
description = "One compact indicator for any uncommitted Git change"

[conda]
symbol = ""
style = "fg:crust bg:sapphire"
format = "[](sapphire)[ $symbol $environment ]($style)[](sapphire) "
ignore_base = false

[time]
disabled = false
time_format = "%H:%M"
style = "fg:crust bg:lavender"
format = "[](lavender)[  $time ]($style)[](lavender)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold lavender)"
vimcmd_replace_symbol = "[❮](bold lavender)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
