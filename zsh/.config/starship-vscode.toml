"$schema" = "https://starship.rs/config-schema.json"

format = """
[](cyan)\
$username\
[](fg:cyan bg:magenta)\
$directory\
[](magenta) \
$git_branch\
${custom.git_dirty}\
$conda\
$time\
$line_break\
$character"""

# ANSI colors follow Ghostty or the active VS Code Profile.
add_newline = false

[username]
show_always = true
style_user = "fg:black bg:cyan"
style_root = "fg:black bg:red"
format = "[ $user ]($style)"

[directory]
style = "fg:black bg:magenta"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:black bg:yellow"
format = "[](yellow)[ $symbol $branch ]($style)[](yellow) "
truncation_length = 18
truncation_symbol = "…"

[custom.git_dirty]
command = "printf '●'"
when = "test -n \"$(git status --porcelain --ignore-submodules=dirty 2>/dev/null)\""
require_repo = true
shell = ["/bin/sh"]
format = "[](red)[ $output ](fg:black bg:red)[](red) "
description = "One compact indicator for any uncommitted Git change"

[conda]
symbol = ""
style = "fg:black bg:blue"
format = "[](blue)[ $symbol $environment ]($style)[](blue) "
ignore_base = false

[time]
disabled = false
time_format = "%H:%M"
style = "fg:black bg:bright-blue"
format = "[](bright-blue)[  $time ]($style)[](bright-blue)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold bright-blue)"
vimcmd_replace_symbol = "[❮](bold bright-blue)"
vimcmd_visual_symbol = "[❮](bold yellow)"
