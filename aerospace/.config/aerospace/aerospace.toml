# --- AeroSpace 极客配置 (M5 Pro 14" 特调版) ---

# 1. 全局布局设置
start-at-login = true

# 让所有工作区默认进入“水平”布局（左右手风琴的前提）
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# 2. 桌面外壳启动与状态同步
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders',
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

on-focus-changed = [
  'exec-and-forget sketchybar --trigger aerospace_focus_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# 鼠标只在切换显示器时跟随焦点
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# 3. 窗口间距
[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.right = 12
outer.top = 12
outer.bottom = 12

# --- 快捷键绑定 (Main Mode) ---
[mode.main.binding]

# 【核心：手风琴切换】
# Alt + , (逗号) 切换平铺与手风琴模式
alt-comma = 'layout accordion tiles'

# 【录制专注模式】
# Alt + R 全屏当前窗口并临时移除外边距；再次按下恢复原布局
alt-r = 'fullscreen --no-outer-gaps'

# 【窗口导航：Vim 习惯】
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# 【移动窗口：Vim 习惯 + Shift】
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# 【工作区切换：1-9】
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# 【将窗口送往工作区】
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

# 【悬浮窗口控制】
# 按 Alt + Shift + F 切换当前窗口悬浮/平铺
alt-shift-f = 'layout floating tiling'

# 【重载配置：改完即生效】
alt-shift-c = 'reload-config'

# 【分屏方向切换】
alt-v = 'layout tiles vertical'
alt-b = 'layout tiles horizontal'

# --- 自动规则 ---
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = "move-node-to-workspace 1"
